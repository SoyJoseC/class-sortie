upstream caricue_api {
    # `api` is the backend service name in docker-compose.
    server api:8000;
    keepalive 16;
}

# Long-lived immutable assets versus the HTML shell, which must never be
# cached or students will run an old bundle after a deploy.
map $uri $caricue_cache_control {
    default                 "no-cache";
    ~*^/assets/             "public, max-age=31536000, immutable";
    ~*\.(?:svg|png|ico|webp|woff2)$ "public, max-age=2592000";
}

server {
    listen 80;
    server_name _;

    # The SPA bundle and Django's admin static files are both served from
    # disk; only /api and /django-admin reach the application server.
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;      # CSV rosters are small
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Nginx's own liveness endpoint, distinct from the API's /api/health/.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://caricue_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django reads this to decide whether the request arrived over HTTPS,
        # which drives secure-cookie and redirect behaviour.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }

    location /django-admin/ {
        proxy_pass http://caricue_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # WhiteNoise serves Django's static files through the API, so /static/
    # is proxied rather than read from the SPA bundle.
    location /static/ {
        proxy_pass http://caricue_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Client-side routing: /join and /s/<token> are real URLs to a student, so
    # anything that is not a file on disk falls back to the SPA shell.
    location / {
        add_header Cache-Control $caricue_cache_control;
        try_files $uri $uri/ /index.html;
    }
}
