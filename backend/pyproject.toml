[project]
name = "caricue-backend"
version = "0.1.0"
description = "CariCue - teacher-first formative assessment API"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 90
extend-exclude = [".venv", "**/migrations/*"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "BLE",    # blind except
    "C4",     # comprehensions
    "DJ",     # flake8-django
    "S",      # bandit security checks
    "RUF",    # ruff-specific
    "SIM",    # flake8-simplify
    "TID",    # tidy imports
]
ignore = [
    "S101",   # pytest relies on assert
    "B008",   # DRF/Django idioms call functions in defaults
    "RUF012", # Django class attrs are conventionally mutable
]

[tool.ruff.lint.per-file-ignores]
"caricue/tests/*" = ["S105", "S106", "S311"]
"caricue/*/management/commands/*" = ["S106", "S311"]
"caricue/settings.py" = ["S105"]
"caricue/settings_test.py" = ["E402", "F403", "S105"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "caricue.settings_test"
python_files = ["test_*.py"]
testpaths = ["caricue/tests"]
addopts = "-q --strict-markers"
